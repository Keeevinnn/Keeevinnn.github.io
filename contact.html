<!doctype html>
<!-- 个人主页 · 联系页 —— 联系方式 + 留言表单（仿参考站登录页风格） -->
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>联系 · 个人主页</title>
  <meta name="description" content="联系我 —— 合作邀约与留言。" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%233ec6e0'/%3E%3Cstop offset='0.5' stop-color='%236e5be8'/%3E%3Cstop offset='1' stop-color='%23c86ef0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='50' cy='50' r='46' fill='url(%23g)'/%3E%3Cpath d='M50 28 L57 44 L74 44 L61 55 L66 72 L50 61 L34 72 L39 55 L26 44 L43 44 Z' fill='white' opacity='0.92'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="site-header">
    <div class="container nav-inner">
      <a class="brand" href="index.html" aria-label="返回首页">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 4 L14.4 9.6 L20 12 L14.4 14.4 L12 20 L9.6 14.4 L4 12 L9.6 9.6 Z" fill="#fff"/></svg>
        </span>
        <span class="brand-cn">个人主页</span>
        <span class="brand-en">Portfolio</span>
      </a>
      <nav aria-label="主导航">
        <ul class="nav-links" id="navLinks">
          <li><a href="index.html">主页</a></li>
          <li><a href="projects.html">项目</a></li>
          <li><a href="about.html">关于</a></li>
          <li><a href="contact.html" class="active">联系</a></li>
        </ul>
      </nav>
      <div class="nav-actions">
        <div class="theme-menu">
          <button class="icon-btn" id="themeBtn" aria-label="切换主题" title="切换主题">
            <svg id="themeIcon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <circle cx="12" cy="12" r="4.2"/>
              <path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5 5l1.7 1.7M17.3 17.3 19 19M19 5l-1.7 1.7M6.7 17.3 5 19"/>
            </svg>
          </button>
          <div class="theme-pop" id="themePop" role="menu">
            <button class="theme-opt" data-theme="light" role="menuitem">浅色 <span class="check">✓</span></button>
            <button class="theme-opt" data-theme="dark" role="menuitem">深色 <span class="check">✓</span></button>
            <button class="theme-opt" data-theme="system" role="menuitem">跟随系统 <span class="check">✓</span></button>
          </div>
        </div>
        <button class="icon-btn" id="navToggle" aria-label="切换导航菜单" title="菜单">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="page-main">
    <section class="section" style="padding-top: 2.5rem;">
      <div class="container contact-wrap">

        <!-- 左侧联系方式 -->
        <div class="contact-info reveal">
          <span class="tag">联系我</span>
          <h2>一起做点什么？</h2>
          <p>无论是项目合作、技术交流还是单纯聊聊，都欢迎随时联系我。通常会在 24 小时内回复。</p>

          <div class="contact-channels">
            <a class="channel" href="mailto:you@example.com"> <!-- TODO -->
              <span class="ico">✉</span>
              <div><b>邮箱</b><span>you@example.com</span></div>
            </a>
            <a class="channel" href="https://github.com/" target="_blank" rel="noopener"> <!-- TODO -->
              <span class="ico">⌥</span>
              <div><b>GitHub</b><span>github.com/yourname</span></div>
            </a>
            <a class="channel" href="https://gitee.com/" target="_blank" rel="noopener"> <!-- TODO -->
              <span class="ico">⌂</span>
              <div><b>Gitee</b><span>gitee.com/yourname</span></div>
            </a>
          </div>
        </div>

        <!-- 右侧留言表单 -->
        <div class="form-card reveal">
          <h3>给我留言</h3>
          <p class="form-sub">填好下面的表单，我会尽快回复你。</p>

          <form id="contactForm" novalidate>
            <div class="field">
              <label for="fName">你的称呼</label>
              <input type="text" id="fName" name="name" placeholder="怎么称呼你" autocomplete="name" required />
            </div>
            <div class="field">
              <label for="fEmail">联系邮箱 <span class="hint">用于回复你</span></label>
              <input type="email" id="fEmail" name="email" placeholder="you@example.com" autocomplete="email" required />
            </div>
            <div class="field">
              <label for="fTopic">主题</label>
              <select id="fTopic" name="topic">
                <option value="合作">项目合作</option>
                <option value="交流">技术交流</option>
                <option value="工作">工作机会</option>
                <option value="其他">其他</option>
              </select>
            </div>
            <div class="field">
              <label for="fMsg">留言内容</label>
              <textarea id="fMsg" name="message" placeholder="想说的话..." required></textarea>
            </div>

            <div class="form-legal">
              <input type="checkbox" id="fAgree" required />
              <label for="fAgree">我已阅读并同意隐私说明，我的信息仅用于本次回复。</label>
            </div>

            <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">发送留言 →</button>

            <div class="form-msg" id="formMsg" role="status"></div>
          </form>
        </div>

      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span>© <span id="year"></span> 你的名字 · 保留所有权利</span>
      <div class="footer-links">
        <a href="https://github.com/" target="_blank" rel="noopener">GitHub</a>
        <a href="https://gitee.com/" target="_blank" rel="noopener">Gitee</a>
        <a href="mailto:you@example.com">邮箱</a>
      </div>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
